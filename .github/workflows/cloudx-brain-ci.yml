name: CloudX Brain CI
on:
  push:
    branches: [main, "cloudx/**"]
    paths: ["cloudx-brain/**"]
  pull_request:
    paths: ["cloudx-brain/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r cloudx-brain/requirements.txt
      - run: PYTHONPATH=cloudx-brain pytest -q cloudx-brain/tests
