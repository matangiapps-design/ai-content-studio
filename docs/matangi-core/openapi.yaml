openapi: 3.1.0
info:
  title: MATANGI CORE API (Draft)
  version: 0.1.0
  description: >
    Initial API contract for MATANGI product orchestration.
    Draft only; no deployed service is implied.
servers:
  - url: https://api.example.invalid
    description: Placeholder; replace only after staging is deployed.
paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      responses:
        '200':
          description: Service process is alive
  /ready:
    get:
      operationId: readiness
      summary: Dependency readiness check
      responses:
        '200':
          description: Required dependencies are ready
        '503':
          description: One or more required dependencies are unavailable
  /v1/jobs:
    post:
      operationId: createJob
      summary: Submit a product job
      description: Requires authentication and an idempotency key.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJob'
      responses:
        '202':
          description: Job accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '409':
          description: Idempotency key conflict
    get:
      operationId: listJobs
      summary: List jobs for the authenticated user
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Job list
  /v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Get job status and output metadata
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
        '404':
          description: Job not found
    delete:
      operationId: cancelJob
      summary: Request job cancellation
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Cancellation requested
        '404':
          description: Job not found
components:
  schemas:
    CreateJob:
      type: object
      required: [project_id, product, task, input]
      properties:
        project_id:
          type: string
        product:
          type: string
          enum: [content-studio, musicvision, seed-vc, cloudphone]
        task:
          type: string
          minLength: 1
        provider:
          type: string
          description: Optional provider preference; server validates capability and license.
        input:
          type: object
          additionalProperties: true
    Job:
      type: object
      required: [job_id, project_id, product, state, created_at]
      properties:
        job_id:
          type: string
        project_id:
          type: string
        product:
          type: string
        provider:
          type: string
        state:
          type: string
          enum: [queued, validating, running, storing, succeeded, failed, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        output:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
