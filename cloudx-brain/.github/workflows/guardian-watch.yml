name: CloudX Guardian Watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured repositories
        env:
          GH_TOKEN: ${{ secrets.CLOUDX_GITHUB_TOKEN }}
          REPOS: ${{ vars.CLOUDX_GITHUB_REPOS }}
        run: |
          python - <<'PY'
          import os, sys, urllib.request
          token = os.getenv("GH_TOKEN", "")
          repos = [r.strip() for r in os.getenv("REPOS", "").split(",") if r.strip()]
          headers = {"Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"}
          if token: headers["Authorization"] = "Bearer " + token
          failures = []
          for repo in repos:
              req = urllib.request.Request("https://api.github.com/repos/" + repo, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      print(repo, response.status)
              except Exception as exc:
                  failures.append((repo, str(exc)))
          for failure in failures: print("FINDING:", failure)
          if failures: sys.exit(1)
          PY
